packages:
  - "apps/*"
  - "packages/*"

overrides:
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "js-yaml@>=5.0.0 <=5.2.1": "5.2.2"
  "nanoid@<3.3.17": "3.3.17"
  "postcss@<8.5.23": "8.5.23"
  "sharp@<0.35.0": "0.35.0"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@node-rs/argon2"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "sharp"
