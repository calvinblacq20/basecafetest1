services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: base_cafe
      POSTGRES_USER: base_cafe
      POSTGRES_PASSWORD: base_cafe_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base_cafe -d base_cafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - base_cafe_postgres:/var/lib/postgresql/data

volumes:
  base_cafe_postgres:
